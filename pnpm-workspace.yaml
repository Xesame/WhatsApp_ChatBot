packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (pnpm blocks all others).
# esbuild downloads its platform binary; drizzle-kit and vite need it.
allowBuilds:
  esbuild: true
  # baileys only checks the Node version; protobufjs only sets up its CLI.
  baileys: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.13'
  - '@better-auth/drizzle-adapter@1.7.13'
  - '@better-auth/kysely-adapter@1.7.13'
  - '@better-auth/memory-adapter@1.7.13'
  - '@better-auth/mongo-adapter@1.7.13'
  - '@better-auth/prisma-adapter@1.7.13'
  - '@better-auth/telemetry@1.7.13'
  - better-auth@1.7.13
